name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flutter Project and Build
        run: |
          cp lib/main.dart /tmp/app_main.dart
          flutter create --org com.gopq.downloader app
          cd app
          cp /tmp/app_main.dart lib/main.dart
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          flutter pub add webview_flutter url_launcher
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gopq-Media-Downloader
          path: app/build/app/outputs/flutter-apk/app-release.apk
